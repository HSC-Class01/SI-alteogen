name: DART monthly update and Pages
on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Re-fetch all available financial periods
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '15 0 1 * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dart-pages
  cancel-in-progress: false
jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect DART filings and financials
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            python agent.py --full
          else
            python agent.py
          fi
      - run: python build_site.py
      - name: Commit refreshed data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh DART financial data"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
